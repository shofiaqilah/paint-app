<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint 2D - Kreativitas Tanpa Batas</title>
    <!-- Import Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Import Bootstrap Icons untuk memperindah tombol -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Hubungkan ke berkas style.css eksternal -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- TOPBAR -->
    <header class="navbar navbar-expand-lg topbar px-3 py-2">
      <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between gap-2">
        
        <!-- Logo / Judul -->
        <div class="d-flex align-items-center">
          <i class="bi bi-palette-fill text-primary fs-4 me-2"></i>
          <span class="topbar-title">Paint 2D</span>
        </div>

        <!-- Alat Utama (Toolbar) -->
        <div class="d-flex flex-wrap align-items-center gap-2">
          <!-- Mode Select -->
          <button class="btn btn-outline-info btn-sm shape-btn" data-shape="select_mode">
            <i class="bi bi-cursor-fill me-1"></i> Mode Select
          </button>
          
          <div class="divider"></div>

          <!-- Geometri Tools -->
          <div class="btn-group btn-group-sm" role="group" aria-label="Geometri">
            <button class="btn btn-outline-secondary shape-btn active" data-shape="bresenham_line">Garis</button>
            <button class="btn btn-outline-secondary shape-btn" data-shape="midpoint_circle">Lingkaran</button>
            <button class="btn btn-outline-secondary shape-btn" data-shape="elips">Elips</button>
            <button class="btn btn-outline-secondary shape-btn" data-shape="square">Persegi</button>
            <button class="btn btn-outline-secondary shape-btn" data-shape="rectangle">Persegi Panjang</button>
            <button class="btn btn-outline-secondary shape-btn" data-shape="triangle">Segitiga</button>
          </div>

          <div class="divider"></div>

          <!-- Pengaturan Dinamis (Garis & Segitiga) -->
          <div class="d-flex align-items-center gap-2">
            <!-- Pilihan Algoritma Garis -->
            <div id="lineTypePanel" class="input-group input-group-sm" style="width: auto;">
              <span class="input-group-text bg-light text-muted">Algoritma</span>
              <select id="lineTypeSelect" class="form-select form-select-sm">
                <option>DDA</option>
                <option>Bresenham</option>
              </select>
            </div>

            <!-- Tipe Garis -->
            <select id="lineStyleSelect" class="form-select form-select-sm" style="width: auto;">
              <option value="solid">Solid</option>
              <option value="dashed">Dashed</option>
              <option value="dotted">Dotted</option>
              <option value="dashed-dotted">Dashed-Dotted</option>
            </select>

            <!-- Pilihan Tipe Segitiga (Hidden by Default) -->
            <div id="triangleTypePanel" class="input-group input-group-sm" style="display: none; width: auto;">
              <span class="input-group-text bg-light text-muted">Tipe</span>
              <select id="triangleTypeSelect" class="form-select form-select-sm">
                <option value="right">Siku-siku</option>
                <option value="isosceles">Sama Kaki</option>
                <option value="equilateral">Sama Sisi</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Aksi Global (Warna, Hapus, Clear) -->
        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="color-picker-wrapper">
            <input type="color" id="colorPicker" title="Pilih Warna" />
          </div>
          <button id="deleteShapeBtn" class="btn btn-danger btn-sm">
            <i class="bi bi-trash-fill"></i> Hapus Objek
          </button>
          <button id="clearBtn" class="btn btn-warning btn-sm text-white">
            <i class="bi bi-trash3"></i> Reset
          </button>
        </div>

      </div>
    </header>

    <!-- MAIN BODY -->
    <div class="main">
      <!-- SIDEBAR -->
      <aside class="sidebar p-3 d-flex flex-column gap-3">
        
        <!-- Card 1: Ketebalan -->
        <div class="card shadow-sm border-light">
          <div class="card-header py-2 bg-light">
            <h6 class="card-title mb-0"><i class="bi bi-border-width text-primary me-2"></i>Ketebalan Garis</h6>
          </div>
          <div class="card-body py-3">
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted small">Ukuran kuas:</span>
              <span class="badge bg-primary"><span id="lineWidthLabel">1</span>px</span>
            </div>
            <input type="range" id="lineWidthInput" class="form-range" min="1" max="10" value="1" />
          </div>
        </div>

        <!-- Card 2: Fill -->
        <div class="card shadow-sm border-light">
          <div class="card-header py-2 bg-light">
            <h6 class="card-title mb-0"><i class="bi bi-paint-bucket text-primary me-2"></i>Warna Isi (Fill)</h6>
          </div>
          <div class="card-body">
            <select id="fillSelect" class="form-select form-select-sm mb-3">
              <option value="Scan Line">Scan Line</option>
              <option value="Inside-Outside">Inside-Outside</option>
              <option value="Flood Fill">Flood Fill</option>
              <option value="Boundary Fill">Boundary Fill</option>
            </select>
            <button id="applyFillBtn" class="btn btn-primary btn-sm w-100">
              <i class="bi bi-palette me-1"></i> Apply Fill
            </button>
          </div>
        </div>

        <!-- Card 3: Transformasi -->
        <div class="card shadow-sm border-light">
          <div class="card-header py-2 bg-light">
            <h6 class="card-title mb-0"><i class="bi bi-arrows-move text-primary me-2"></i>Transformasi</h6>
          </div>
          <div class="card-body">
            <!-- Nav Tab Transformasi -->
            <div class="transform-grid gap-1 mb-3">
              <button class="btn btn-sm btn-outline-secondary xf-tab active" data-target="translate">Trans</button>
              <button class="btn btn-sm btn-outline-secondary xf-tab" data-target="rotate">Rotasi</button>
              <button class="btn btn-sm btn-outline-secondary xf-tab" data-target="scale">Skala</button>
              <button class="btn btn-sm btn-outline-secondary xf-tab" data-target="reflect">Cermin</button>
              <button class="btn btn-sm btn-outline-secondary xf-tab" data-target="shear">Shear</button>
            </div>

            <!-- Panel Translasi -->
            <div class="xf-panel active" id="translate">
              <div class="input-group input-group-sm mb-2">
                <span class="input-group-text">Step (px)</span>
                <input type="number" id="translateStep" class="form-control" value="20" />
              </div>
              <div class="compass mt-3">
                <button id="btn-translate" class="btn btn-light" data-tx="-1" data-ty="-1">↖</button>
                <button id="btn-translate" class="btn btn-light fw-bold" data-tx="0" data-ty="-1">↑</button>
                <button id="btn-translate" class="btn btn-light" data-tx="1" data-ty="-1">↗</button>
                <button id="btn-translate" class="btn btn-light fw-bold" data-tx="-1" data-ty="0">←</button>
                <button class="btn btn-light text-muted" disabled>•</button>
                <button id="btn-translate" class="btn btn-light fw-bold" data-tx="1" data-ty="0">→</button>
                <button id="btn-translate" class="btn btn-light" data-tx="-1" data-ty="1">↙</button>
                <button id="btn-translate" class="btn btn-light fw-bold" data-tx="0" data-ty="1">↓</button>
                <button id="btn-translate" class="btn btn-light" data-tx="1" data-ty="1">↘</button>
              </div>
            </div>

            <!-- Panel Rotasi -->
            <div class="xf-panel" id="rotate">
              <div class="input-group input-group-sm mb-3">
                <span class="input-group-text">Sudut (°)</span>
                <input type="number" id="rotateAngle" class="form-control" value="45" />
              </div>
              <div class="d-flex gap-2">
                <button id="btn-rotate-left" class="btn btn-outline-dark btn-sm flex-fill">
                  <i class="bi bi-arrow-counterclockwise"></i> Kiri
                </button>
                <button id="btn-rotate-right" class="btn btn-outline-dark btn-sm flex-fill">
                  <i class="bi bi-arrow-clockwise"></i> Kanan
                </button>
              </div>
            </div>

            <!-- Panel Scaling -->
            <div class="xf-panel" id="scale">
              <div class="input-group input-group-sm mb-2">
                <span class="input-group-text">Sumbu X</span>
                <input type="number" id="scaleSx" class="form-control" value="1.5" step="0.1" />
              </div>
              <div class="input-group input-group-sm mb-3">
                <span class="input-group-text">Sumbu Y</span>
                <input type="number" id="scaleSy" class="form-control" value="1.5" step="0.1" />
              </div>
              <button id="btn-scale" class="btn btn-dark btn-sm w-100">Terapkan Skala</button>
            </div>

            <!-- Panel Refleksi -->
            <div class="xf-panel" id="reflect">
              <div class="row g-2">
                <div class="col-6"><button id="btn-reflect" class="btn btn-outline-dark btn-sm w-100" data-axis="X">Sumbu X</button></div>
                <div class="col-6"><button id="btn-reflect" class="btn btn-outline-dark btn-sm w-100" data-axis="Y">Sumbu Y</button></div>
                <div class="col-6"><button id="btn-reflect" class="btn btn-outline-dark btn-sm w-100" data-axis="XY">y = x</button></div>
                <div class="col-6"><button id="btn-reflect" class="btn btn-outline-dark btn-sm w-100" data-axis="ORIGIN">y = -x</button></div>
              </div>
            </div>

            <!-- Panel Shear -->
            <div class="xf-panel" id="shear">
              <div class="input-group input-group-sm mb-2">
                <span class="input-group-text">Geser X (Shx)</span>
                <input type="number" id="shearShx" class="form-control" value="0.3" step="0.1" />
              </div>
              <div class="input-group input-group-sm mb-3">
                <span class="input-group-text">Geser Y (Shy)</span>
                <input type="number" id="shearShy" class="form-control" value="0" step="0.1" />
              </div>
              <button id="btn-shear" class="btn btn-dark btn-sm w-100">Terapkan Shear</button>
            </div>

          </div>
        </div>

        <!-- Card 4: Pena Bebas -->
        <div class="card shadow-sm border-light">
          <div class="card-header py-2 bg-light">
            <h6 class="card-title mb-0"><i class="bi bi-brush text-primary me-2"></i>Pena Bebas <span class="badge bg-warning text-dark small-text">Raster</span></h6>
          </div>
          <div class="card-body">
            <div class="pena-grid">
              <button class="btn btn-sm btn-outline-dark shape-btn" data-shape="pencil" title="Pensil"><i class="bi bi-pencil"></i> Pencil</button>
              <button class="btn btn-sm btn-outline-dark shape-btn" data-shape="pen" title="Pena"><i class="bi bi-pen"></i> Pen</button>
              <button class="btn btn-sm btn-outline-dark shape-btn" data-shape="marker" title="Marker"><i class="bi bi-brush-fill"></i> Marker</button>
              <button class="btn btn-sm btn-outline-dark shape-btn" data-shape="airbrush" title="Semprotan"><i class="bi bi-cloud-snow"></i> Spray</button>
              <button class="btn btn-sm btn-outline-dark shape-btn" data-shape="watercolor" title="Cat Air"><i class="bi bi-droplet-fill"></i> Water</button>
              <button class="btn btn-sm btn-outline-danger shape-btn" data-shape="eraser" title="Penghapus"><i class="bi bi-eraser-fill"></i> Eraser</button>
            </div>
          </div>
        </div>

      </aside>

      <!-- CANVAS AREA -->
      <main class="canvas-area">
        <div class="canvas-container shadow">
          <canvas id="paintCanvas" width="900" height="550"></canvas>
        </div>
      </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer d-flex justify-content-between align-items-center px-3 py-1">
      <div id="footerStatus" class="fw-medium text-muted">Tool aktif : Garis Bresenham</div>
      <div class="text-muted small">Versi Pro 2.0</div>
    </footer>

    <!-- Bootstrap 5 JS via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
    
    <script>
      // Tab transformasi switcher
      const tabs = document.querySelectorAll(".xf-tab");
      const panels = document.querySelectorAll(".xf-panel");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          panels.forEach((p) => p.classList.remove("active"));

          tab.classList.add("active");
          document.getElementById(tab.dataset.target).classList.add("active");
        });
      });

      // Label ketebalan garis slider
      const lineWidthInput = document.getElementById("lineWidthInput");
      const lineWidthLabel = document.getElementById("lineWidthLabel");
      lineWidthInput.addEventListener("input", () => {
        lineWidthLabel.textContent = lineWidthInput.value;
      });
    </script>
  </body>
</html>
