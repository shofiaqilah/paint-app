<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint 2D</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #dcdcdc;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* TOPBAR */
      .topbar {
        background: #cfcfcf;
        border-bottom: 1px solid #999;
        padding: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .topbar-title {
        font-weight: bold;
        margin-right: 10px;
      }

      button,
      select,
      input {
        font-size: 12px;
      }

      button {
        padding: 5px 10px;
        border: 1px solid #888;
        background: white;
        cursor: pointer;
      }

      button:hover {
        background: #eaeaea;
      }

      button.active {
        background: #2d7ff9;
        color: white;
      }

      select {
        padding: 4px;
        border: 1px solid #888;
      }

      input[type="range"] {
        width: 80px;
      }

      .divider {
        width: 1px;
        height: 25px;
        background: #999;
        margin: 0 4px;
      }

      /* MAIN */
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* SIDEBAR */
      .sidebar {
        width: 260px;
        background: #efefef;
        border-right: 1px solid #999;
        padding: 10px;
        overflow-y: auto;
      }

      .panel {
        background: white;
        border: 1px solid #aaa;
        margin-bottom: 12px;
      }

      .panel-title {
        background: #d6d6d6;
        padding: 6px 8px;
        font-weight: bold;
        border-bottom: 1px solid #aaa;
        font-size: 13px;
      }

      .panel-body {
        padding: 10px;
      }

      .panel-body label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .panel-body input,
      .panel-body select {
        margin-bottom: 10px;
        width: 100%;
      }

      /* TRANSFORM */
      .transform-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .transform-grid button {
        padding: 6px;
      }

      .compass {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        margin-top: 10px;
      }

      .compass button {
        padding: 10px;
      }

      /* CANVAS */
      .canvas-area {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #bdbdbd;
        padding: 20px;
      }

      canvas {
        background: white;
        border: 1px solid #666;
      }

      /* FOOTER */
      .footer {
        background: #cfcfcf;
        border-top: 1px solid #999;
        padding: 5px 10px;
        font-size: 12px;
      }

      .xf-panel {
        display: none;
        margin-top: 12px;
      }

      .xf-panel.active {
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title">Paint 2D</div>

      <button class="shape-btn" data-shape="select_mode" style="background: #e1f5fe; border-color: #03a9f4;">Mode Select</button>
      <div class="divider"></div>
      <button class="shape-btn active" data-shape="bresenham_line">Garis</button>
      <button class="shape-btn" data-shape="midpoint_circle">Lingkaran</button>
      <button class="shape-btn" data-shape="elips">Elips</button>
      <button class="shape-btn" data-shape="square">Persegi</button>
      <button class="shape-btn" data-shape="rectangle">Persegi Panjang</button>
      <button class="shape-btn" data-shape="triangle">Segitiga</button>

      <div class="divider"></div>

      <span id="lineTypePanel" style="display:inline-flex; align-items:center; gap:4px;">
        <label style="font-size:12px; white-space:nowrap;">Algoritma:</label>
        <select id="lineTypeSelect">
          <option>DDA</option>
          <option>Bresenham</option>
        </select>
      </span>

      <select id="lineStyleSelect">
        <option value="solid">Solid</option>
        <option value="dashed">Dashed</option>
        <option value="dotted">Dotted</option>
        <option value="dashed-dotted">Dashed-dotted</option>
      </select>

      <span id="triangleTypePanel" style="display:none; align-items:center; gap:4px;">
        <label style="font-size:12px; white-space:nowrap;">Segitiga:</label>
        <select id="triangleTypeSelect">
          <option value="right">Siku-siku</option>
          <option value="isosceles">Sama Kaki</option>
          <option value="equilateral">Sama Sisi</option>
        </select>
      </span>

      <input type="color" id="colorPicker" />
      <button id="deleteShapeBtn" style="background: #ffebee; border-color: #ef5350; color: #c62828;">Hapus Objek</button>
      <button id="clearBtn">Clear</button>
    </div>

    <!-- MAIN -->
    <div class="main">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <!-- Ketebalan -->
        <div class="panel">
          <div class="panel-title">Ketebalan Garis</div>

          <div class="panel-body">
            <label>Tebal: <span id="lineWidthLabel">1</span>px</label>
            <input type="range" id="lineWidthInput" min="1" max="10" value="1" />
          </div>
        </div>

        <!-- Fill -->
        <div class="panel">
          <div class="panel-title">Algoritma Fill</div>

          <div class="panel-body">
            <select id="fillSelect">
              <option value="Scan Line">Scan Line</option>
              <option value="Inside-Outside">Inside-Outside</option>
              <option value="Flood Fill">Flood Fill</option>
              <option value="Boundary Fill">Boundary Fill</option>
            </select>

            <button id="applyFillBtn">Apply Fill</button>
          </div>
        </div>

        <!-- Transformasi -->
        <!-- Transformasi -->
        <div class="panel">
          <div class="panel-title">Transformasi</div>

          <div class="panel-body">
            <!-- TAB -->
            <div class="transform-grid">
              <button class="xf-tab active" data-target="translate">
                Translasi
              </button>

              <button class="xf-tab" data-target="rotate">Rotasi</button>

              <button class="xf-tab" data-target="scale">Scaling</button>

              <button class="xf-tab" data-target="reflect">Refleksi</button>

              <button class="xf-tab" data-target="shear">Shear</button>
            </div>

            <!-- TRANSLASI -->
            <div class="xf-panel active" id="translate">
              <label>Step (px)</label>
              <input type="number" id="translateStep" value="20" />

              <div class="compass">
                <button id="btn-translate" data-tx="-1" data-ty="-1">↖</button>
                <button id="btn-translate" data-tx="0"  data-ty="-1">↑</button>
                <button id="btn-translate" data-tx="1"  data-ty="-1">↗</button>
                <button id="btn-translate" data-tx="-1" data-ty="0">←</button>
                <button disabled>•</button>
                <button id="btn-translate" data-tx="1"  data-ty="0">→</button>
                <button id="btn-translate" data-tx="-1" data-ty="1">↙</button>
                <button id="btn-translate" data-tx="0"  data-ty="1">↓</button>
                <button id="btn-translate" data-tx="1"  data-ty="1">↘</button>
              </div>
            </div>

            <!-- ROTASI -->
            <div class="xf-panel" id="rotate">
              <label>Sudut (derajat)</label>
              <input type="number" id="rotateAngle" value="45" />

              <div class="transform-grid">
                <button id="btn-rotate-left">↺ Kiri</button>
                <button id="btn-rotate-right">↻ Kanan</button>
              </div>
            </div>

            <!-- SCALING -->
            <div class="xf-panel" id="scale">
              <label>Sx</label>
              <input type="number" id="scaleSx" value="1.5" step="0.1" />

              <label>Sy</label>
              <input type="number" id="scaleSy" value="1.5" step="0.1" />

              <button id="btn-scale" style="margin-top: 10px">Terapkan Scaling</button>
            </div>

            <!-- REFLEKSI -->
            <div class="xf-panel" id="reflect">
              <div class="transform-grid">
                <button id="btn-reflect" data-axis="X">Sumbu X</button>
                <button id="btn-reflect" data-axis="Y">Sumbu Y</button>
                <button id="btn-reflect" data-axis="XY">y = x</button>
                <button id="btn-reflect" data-axis="ORIGIN">y = -x</button>
              </div>
            </div>

            <!-- SHEAR -->
            <div class="xf-panel" id="shear">
              <label>Shx</label>
              <input type="number" id="shearShx" value="0.3" step="0.1" />

              <label>Shy</label>
              <input type="number" id="shearShy" value="0" step="0.1" />

              <button id="btn-shear" style="margin-top: 10px">Terapkan Shear</button>
            </div>
          </div>
        </div>

        <!-- Pena -->
        <div class="panel">
          <div class="panel-title">Pena Bebas</div>

          <div class="panel-body">
            <button>Pencil</button>
            <button>Marker</button>
            <button>Airbrush</button>
          </div>
        </div>
      </div>

      <!-- CANVAS -->
      <div class="canvas-area">
        <canvas id="paintCanvas" width="900" height="550"></canvas>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">Tool aktif : Garis Bresenham</div>
    <script type="module" src="js/main.js"></script>
    <script>
      // Tab transformasi
      const tabs = document.querySelectorAll(".xf-tab");
      const panels = document.querySelectorAll(".xf-panel");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          panels.forEach((p) => p.classList.remove("active"));

          tab.classList.add("active");

          document.getElementById(tab.dataset.target).classList.add("active");
        });
      });

      // Label ketebalan garis
      const lineWidthInput = document.getElementById("lineWidthInput");
      const lineWidthLabel = document.getElementById("lineWidthLabel");
      lineWidthInput.addEventListener("input", () => {
        lineWidthLabel.textContent = lineWidthInput.value;
      });
    </script>
  </body>
</html>
